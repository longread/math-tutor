<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ message }}</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
    <!-- MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            },
            startup: {
                ready: () => {
                    console.log('MathJax is loaded and ready');
                    MathJax.startup.defaultReady();
                }
            }
        };
    </script>
    <!-- MathJax CDN -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="container">
        <h1>{{ message }}</h1>

        <div class="input-section">
            <form id="problem-form">
                <label for="problem-text">Enter your math problem (text or LaTeX):</label>
                <textarea id="problem-text" name="problem_text" rows="5" placeholder="e.g., Solve for x: 2x + 5 = 15 or $\frac{1}{2}x + 3 = 7$"></textarea>

                <label for="problem-image">Or upload an image of the problem:</label>
                <input type="file" id="problem-image" name="problem_image" accept="image/*">

                <div class="button-group">
                    <button type="submit" name="action" value="solution">Get Solution</button>
                    <button type="submit" name="action" value="hint">Get Hint</button>
                </div>
            </form>
        </div>

        <div id="loading" style="display: none;">
            Tutor is thinking...
        </div>

        <div class="solution-section">
            <div id="original-question"></div>
            <div id="solution-container">
                <!-- Steps will be rendered here -->
            </div>
            <button id="next-step-button" style="display: none;">Show Next Step</button>
            <div id="error-message" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <script src="/static/script.js?v=3"></script>
</body>
</html>
